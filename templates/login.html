<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CarePoint Login</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-page"><section class="login-card"><h1>CarePoint HMS</h1><p>Sign in to hospital management</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Email address (citizens) or admin username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button class="button" type="submit">Sign in</button></form><p class="register-prompt">New citizen? <a href="{{ url_for('register') }}">Create a citizen account</a></p><p class="register-note">Doctor and staff records are managed by the administrator.</p></section></body></html>
